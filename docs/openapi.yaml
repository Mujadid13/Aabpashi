  /api/admin/api-keys/{id}/revoke:
    post:
      tags:
        - API Key Management
      summary: Revoke API key
      description: Revoke (deactivate) an API key (admin only)
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID
      responses:
        "200":
          description: API key revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API key revoked successfully
        "401":
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/api-keys/{id}/regenerate:
    post:
      tags:
        - API Key Management
      summary: Regenerate API key
      description: Regenerate an API key (creates new key, keeps metadata) (admin only)
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID
      responses:
        "200":
          description: API key regenerated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
        "401":
          description: Unauthorized - Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sync/create-user:
    post:
      tags:
        - User Sync
      summary: Sync user create (internal)
      description: Create or upsert a user in the local database (API key protected, internal use only)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUser"
      responses:
        "200":
          description: User synced (created/updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSuccessResponse"
        "400":
          description: Missing user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sync/update-user:
    post:
      tags:
        - User Sync
      summary: Sync user update (internal)
      description: Update a user in the local database (API key protected, internal use only)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUser"
      responses:
        "200":
          description: User synced (updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSuccessResponse"
        "400":
          description: Missing user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sync/delete-user:
    post:
      tags:
        - User Sync
      summary: Sync user delete (internal)
      description: Delete a user from the local database (API key protected, internal use only)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserDelete"
      responses:
        "200":
          description: User synced (deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSuccessResponse"
        "400":
          description: Missing user identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT token stored in HTTP-only cookie

  schemas:
    # Authentication Schemas
    SignupRequest:
      type: object
      required:
        - name
        - city
        - phone
        - receiverNetwork
        - division
        - farmsize
        - role
        - country
      properties:
        name:
          type: string
          example: "John Doe"
          description: Full name (minimum 2 words)
        city:
          type: string
          example: "Lahore"
          description: City name
        phone:
          type: string
          example: "+923001234567"
          description: Phone number with or without +92 prefix
        receiverNetwork:
          type: string
          example: "Jazz"
          enum: [Jazz, Telenor, Ufone, Zong, SCO]
          description: Mobile network operator
        division:
          type: string
          example: "Kasur"
          description: Administrative division
        farmsize:
          type: string
          example: "5-10 acres"
          enum:
            ["<1 acre", "1-5 acres", "5-10 acres", "10-25 acres", ">25 acres"]
          description: Farm size category
        role:
          type: string
          example: "Farmer"
          enum: [Farmer, Agricultural Officer, Researcher, Other]
          description: User role
        country:
          type: string
          example: "Pakistan"
          description: Country name

    SignupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "OTP sent successfully"
        name:
          type: string
          example: "John Doe"
        city:
          type: string
          example: "Lahore"
        phone:
          type: string
          example: "+923001234567"
        receiverNetwork:
          type: string
          example: "Jazz"
        division:
          type: string
          example: "Kasur"
        farmsize:
          type: string
          example: "5-10 acres"
        role:
          type: string
          example: "Farmer"
        country:
          type: string
          example: "Pakistan"

    VerifyOTPRegisterRequest:
      type: object
      required:
        - phoneNumber
        - otp
        - name
        - city
        - division
        - receiverNetwork
        - farmsize
        - role
        - country
      properties:
        phoneNumber:
          type: string
          example: "+923001234567"
        otp:
          type: string
          example: "1234"
        name:
          type: string
          example: "John Doe"
        city:
          type: string
          example: "Lahore"
        division:
          type: string
          example: "Kasur"
        receiverNetwork:
          type: string
          example: "Jazz"
        farmsize:
          type: string
          example: "5-10 acres"
        role:
          type: string
          example: "Farmer"
        country:
          type: string
          example: "Pakistan"

    LoginRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          example: "+923001234567"
          description: Registered phone number

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "OTP sent successfully"
        phoneNumber:
          type: string
          example: "+923001234567"
        id:
          type: string
          example: "64a1b2c3d4e5f6789012345"
        division:
          type: string
          example: "Kasur"
        name:
          type: string
          example: "John Doe"

    VerifyOTPLoginRequest:
      type: object
      required:
        - phoneNumber
        - otp
      properties:
        phoneNumber:
          type: string
          example: "+923001234567"
        otp:
          type: string
          example: "1234"

    SendOTPRequest:
      type: object
      required:
        - phoneNumber
        - receiverNetwork
      properties:
        phoneNumber:
          type: string
          example: "+923001234567"
        receiverNetwork:
          type: string
          example: "Jazz"

    # Field Management Schemas
    SaveFieldRequest:
      type: object
      required:
        - fieldName
        - cropTypes
        - soilType
        - location
        - userId
      properties:
        fieldName:
          type: string
          example: "North Field"
        cropTypes:
          type: array
          items:
            type: string
          example: ["Wheat", "Cotton"]
        soilType:
          type: string
          example: "Clay"
          enum: [Clay, Loam, Sand, Silt, Rocky]
        location:
          $ref: "#/components/schemas/Location"
        userId:
          type: string
          example: "64a1b2c3d4e5f6789012345"

    SaveFieldResponse:
      type: object
      properties:
        message:
          type: string
          example: "Field data saved successfully"
        data:
          $ref: "#/components/schemas/Field"

    GetFieldRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          example: "64a1b2c3d4e5f6789012345"

    GetFieldResponse:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"

    UpdateFieldRequest:
      type: object
      required:
        - fieldId
        - polygon
      properties:
        fieldId:
          type: string
          example: "64a1b2c3d4e5f6789012346"
        polygon:
          $ref: "#/components/schemas/GeoJSONPolygon"

    DeleteFieldRequest:
      type: object
      required:
        - _id
      properties:
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012346"

    CheckPolygonRequest:
      type: object
      required:
        - fieldId
      properties:
        fieldId:
          type: string
          example: "64a1b2c3d4e5f6789012346"

    CheckPolygonResponse:
      type: object
      properties:
        polygon:
          $ref: "#/components/schemas/GeoJSONPolygon"
        fieldName:
          type: string
          example: "North Field"

    # Geospatial Schemas
    GetCanalsRequest:
      type: object
      required:
        - division
      properties:
        division:
          type: string
          example: "Kasur"

    Canal:
      type: object
      properties:
        name:
          type: string
          example: "Main Canal"
        type:
          type: string
          example: "Primary"
        status:
          type: string
          example: "Active"

    GetWRSRequest:
      type: object
      required:
        - canal
        - division
      properties:
        canal:
          type: string
          example: "Main Canal"
        division:
          type: string
          example: "Kasur"

    WaterReleaseSchedule:
      type: object
      properties:
        schedule:
          type: string
          example: "Water release schedule data"
        priority:
          type: string
          example: "High"
        rotation:
          type: string
          example: "Weekly"

    GetNCDRequest:
      type: object
      required:
        - position
        - division
      properties:
        position:
          $ref: "#/components/schemas/Coordinates"
        division:
          type: string
          example: "Kasur"

    NearestCanalData:
      type: object
      properties:
        nearest_canal:
          type: string
          example: "Main Canal"
        distance:
          type: string
          example: "2.5 km"
        water_availability:
          type: string
          example: "Available"

    GetGEERequest:
      type: object
      required:
        - polygon
      properties:
        polygon:
          $ref: "#/components/schemas/GeoJSONPolygon"

    GEEData:
      type: object
      properties:
        ndvi:
          type: number
          format: float
          example: 0.75
        precipitation:
          type: number
          format: float
          example: 25.5
        temperature:
          type: number
          format: float
          example: 28.3
        soil_moisture:
          type: number
          format: float
          example: 0.65

    GetWeatherRequest:
      type: object
      required:
        - position
      properties:
        position:
          $ref: "#/components/schemas/WeatherPosition"

    WeatherData:
      type: object
      properties:
        daily:
          type: object
          properties:
            time:
              type: array
              items:
                type: string
                format: date
              example: ["2024-01-01", "2024-01-02"]
            temperature_2m_max:
              type: array
              items:
                type: number
                format: float
              example: [25.5, 26.1]
            temperature_2m_min:
              type: array
              items:
                type: number
                format: float
              example: [15.2, 16.0]
            precipitation_sum:
              type: array
              items:
                type: number
                format: float
              example: [0, 2.5]
            relative_humidity_2m_max:
              type: array
              items:
                type: number
                format: float
              example: [85, 80]
            relative_humidity_2m_min:
              type: array
              items:
                type: number
                format: float
              example: [45, 50]

    # Translation Schemas
    TranslateRequest:
      type: object
      required:
        - text
      properties:
        text:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["Main Canal", "Secondary Canal"]
        target:
          type: string
          example: "ur"
          default: "ur"

    TranslateResponse:
      type: object
      properties:
        translation:
          type: array
          items:
            type: string
          example: ["مین کینال", "ثانوی کینال"]

    # Contact Schema
    SaveContactRequest:
      type: object
      required:
        - name
        - phone
        - userMessage
      properties:
        name:
          type: string
          example: "John Doe"
        phone:
          type: string
          example: "3001234567"
        email:
          type: string
          format: email
          example: "john@example.com"
        userMessage:
          type: string
          example: "I need help with water management"

    # Common Schemas
    Location:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: float
          minimum: -90
          maximum: 90
          example: 31.5204
        lng:
          type: number
          format: float
          minimum: -180
          maximum: 180
          example: 74.3587

    Coordinates:
      type: object
      required:
        - lon
        - lat
      properties:
        lon:
          type: number
          format: float
          minimum: -180
          maximum: 180
          example: 74.3587
        lat:
          type: number
          format: float
          minimum: -90
          maximum: 90
          example: 31.5204

    WeatherPosition:
      type: object
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: float
          minimum: -90
          maximum: 90
          example: 31.5204
        lon:
          type: number
          format: float
          minimum: -180
          maximum: 180
          example: 74.3587

    GeoJSONPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Polygon]
          example: "Polygon"
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                format: float
              minItems: 2
              maxItems: 2
          example:
            [
              [
                [74.3587, 31.5204],
                [74.3590, 31.5204],
                [74.3590, 31.5207],
                [74.3587, 31.5207],
                [74.3587, 31.5204],
              ],
            ]

    Field:
      type: object
      properties:
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012346"
        fieldName:
          type: string
          example: "North Field"
        cropTypes:
          type: array
          items:
            type: string
          example: ["Wheat", "Cotton"]
        soilType:
          type: string
          example: "Clay"
        location:
          $ref: "#/components/schemas/Location"
        polygon:
          $ref: "#/components/schemas/GeoJSONPolygon"
        userId:
          type: string
          example: "64a1b2c3d4e5f6789012345"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    # API Key Schemas
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "My App"
          description: Human-readable name for the API key
        userId:
          type: string
          example: "user123"
          description: Associated user ID (optional)
        permissions:
          type: array
          items:
            type: string
            enum: [read, write, admin, delete]
          example: ["read", "write"]
          description: Array of permissions for the API key
        expiresInDays:
          type: integer
          minimum: 1
          example: 30
          description: Expiration in days (optional)

    UpdateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          example: "Updated App Name"
          description: Human-readable name for the API key
        permissions:
          type: array
          items:
            type: string
            enum: [read, write, admin, delete]
          example: ["read", "write", "admin"]
          description: Array of permissions for the API key
        isActive:
          type: boolean
          example: true
          description: Whether the API key is active
        expiresInDays:
          type: integer
          minimum: 1
          example: 60
          description: Expiration in days (0 to remove expiration)

    ApiKeyInfo:
      type: object
      properties:
        id:
          type: string
          example: "abc123def456"
          description: Unique API key identifier
        name:
          type: string
          example: "My App"
          description: Human-readable name
        userId:
          type: string
          example: "user123"
          description: Associated user ID (if any)
        permissions:
          type: array
          items:
            type: string
          example: ["read", "write"]
          description: Array of permissions
        isActive:
          type: boolean
          example: true
          description: Whether the key is active
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
          description: Creation timestamp
        lastUsed:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
          description: Last usage timestamp
        expiresAt:
          type: string
          format: date-time
          example: "2024-02-01T00:00:00.000Z"
          description: Expiration timestamp (if any)

    CreateApiKeyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "API key created successfully"
        data:
          type: object
          properties:
            id:
              type: string
              example: "abc123def456"
            name:
              type: string
              example: "My App"
            key:
              type: string
              example: "aabpashi_1234567890abcdef..."
              description: The actual API key (only shown on creation)
            userId:
              type: string
              example: "user123"
            permissions:
              type: array
              items:
                type: string
              example: ["read", "write"]
            isActive:
              type: boolean
              example: true
            createdAt:
              type: string
              format: date-time
              example: "2024-01-01T00:00:00.000Z"
            expiresAt:
              type: string
              format: date-time
              example: "2024-02-01T00:00:00.000Z"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
        error:
          type: string
          example: "Detailed error information"

    SyncUser:
      type: object
      required:
        - name
        - phone
        - city
        - division
        - role
      properties:
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: "+923001234567"
        city:
          type: string
          example: Lahore
        division:
          type: string
          example: Kasur
        role:
          type: string
          example: Farmer
        # ... other user fields ...

    SyncSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User synced (created/updated)

    SyncUserDelete:
      type: object
      properties:
        phone:
          type: string
          example: "+923001234567"
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012345"

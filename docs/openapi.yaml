openapi: 3.0.3
info:
  title: AaabPashi Web API
  description: |
    AaabPashi is a comprehensive water management and agricultural monitoring platform API.

    The API provides authentication via phone number and OTP, field management, geospatial 
    data processing, water release scheduling, and multilingual support.

    ## Authentication

    This API supports two authentication methods:

    ### 1. JWT-based Authentication (Primary)
    JWT-based authentication with phone number and OTP verification. 
    Authentication tokens are stored in HTTP-only cookies for security.

    ### 2. API Key Authentication (Alternative)
    API key authentication for programmatic access, third-party integrations, 
    and administrative operations. API keys can be provided in headers:
    - `Authorization: Bearer <api-key>`
    - `X-API-Key: <api-key>`

    ### Authentication Priority
    1. API key authentication is checked first
    2. If API key fails, JWT authentication is attempted
    3. If both fail, request is rejected with 401 Unauthorized

    ## Rate Limiting

    OTP endpoints are rate-limited to one request per phone number every 5 minutes.

    ## External Services

    The API integrates with:
    - Veevo SMS API for OTP delivery
    - Google Translate API for multilingual support
    - Open-Meteo API for weather data
    - Google Earth Engine API for satellite imagery
    - Custom Python APIs for geospatial processing

    ## Multi-Platform Sync

    The API supports cross-platform user synchronization with:
    - Farmovation User Server (comprehensive user management)
    - Farmovation Marketplace Platform (e-commerce seller profiles)
    - Automatic field mapping for platform-specific API formats
    - Uniform endpoint structure across all platforms for easier implementation
  version: 1.0.0
  contact:
    name: AaabPashi API Support
    email: support@aabpashi.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://aabpashi.com
    description: Production server
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: API Key Management
    description: API key management endpoints (admin only)
  - name: Field Management
    description: Endpoints for managing agricultural fields
  - name: Geospatial
    description: Geospatial data and water management endpoints
  - name: Translation
    description: Text translation services
  - name: Contact
    description: Contact form management
  - name: User Sync
    description: Cross-platform user synchronization endpoints (API key protected)

security:
  - cookieAuth: []
  - apiKeyAuth: []

paths:
  /{locale}/api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user and send OTP for verification
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [en, ur]
          description: Language locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: OTP already sent, please wait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /{locale}/api/auth/verifyotp-register:
    post:
      tags:
        - Authentication
      summary: Verify OTP for registration
      description: Verify OTP and complete user registration
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [en, ur]
          description: Language locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRegisterRequest"
      responses:
        "200":
          description: User registered successfully
          headers:
            Set-Cookie:
              description: Authentication cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid OTP or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /{locale}/api/auth/login:
    post:
      tags:
        - Authentication
      summary: Send login OTP
      description: Send OTP to existing user for login
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [en, ur]
          description: Language locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Phone number not registered
          content:
            application/json:
              schema:

  /api/getGEE:
    post:
      tags:
        - Geospatial
      summary: Get Google Earth Engine data
      description: Get Google Earth Engine satellite data for a polygon
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetGEERequest"
      responses:
        "200":

          in: path
          required: true
          schema:
            type: string
          description: API key ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApiKeyRequest"
      responses:
        "200":
          description: API key updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API key updated successfully
                  data:
                    $ref: "#/components/schemas/ApiKeyInfo"
        "400":
          description: Invalid input data
          content:

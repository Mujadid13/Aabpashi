        "429":
          description: OTP already sent, please wait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /{locale}/api/auth/verifyotp-login:
    post:
      tags:
        - Authentication
      summary: Verify login OTP
      description: Verify OTP and complete user login
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [en, ur]
          description: Language locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPLoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: Authentication cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid OTP or phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /{locale}/api/auth/sendotp:
    post:
      tags:
        - Authentication
      summary: Send OTP
      description: Send OTP to a phone number (general purpose)
      parameters:
        - name: locale
          in: path
          required: true
